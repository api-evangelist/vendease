name: Vendease
description: >-
  Vendease is a Nigerian B2B food procurement platform (founded 2020, Y
  Combinator W21, backed by Partech Africa and TLcom) that helps restaurants,
  hotels, and other food businesses buy fresh and processed food supplies,
  offering Buy Now, Pay Later financing, supplier consolidation, cold-chain
  logistics, and 24-hour delivery in Lagos. Vendease publishes no public
  developer API or SDKs; its procurement, payments, inventory, and tenant
  management service APIs are internal-only, though its engineering handover
  documentation is publicly available on GitHub.
